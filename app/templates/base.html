<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}Atendimento de TI{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header>
    <div>
      <strong>Atendimento de TI</strong>
      <span>Protótipo acadêmico</span>
    </div>
    <nav>
      <a href="{{ url_for('chamados.listar') }}">Meus chamados</a>
      <a class="botao" href="{{ url_for('chamados.novo') }}">Abrir chamado</a>
    </nav>
  </header>
  <main>
    {% if usuario %}
      <p class="usuario-demo">Usuário de demonstração: <strong>{{ usuario.nome }}</strong></p>
    {% endif %}
    {% for categoria, mensagem in get_flashed_messages(with_categories=true) %}
      <div class="mensagem {{ categoria }}">{{ mensagem }}</div>
    {% endfor %}
    {% block conteudo %}{% endblock %}
  </main>
</body>
</html>
